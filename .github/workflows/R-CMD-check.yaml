# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  # Nightly slow/engine tier (MOSAIC_RUN_SLOW_TESTS=1) and manual dispatch.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true


      - name: Install system deps on Linux (SSL, PROJ, GDAL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libudunits2-dev \
            libproj-dev \
            libgeos-dev \
            libgdal-dev \
            python3-dev

      - name: Install system deps on macOS (SSL + UDUNITS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew update
          brew install \
            openssl@3 \
            udunits

          # Tell R where to find OpenSSL & UDUNITS at compile time
          export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:\
          $(brew --prefix udunits)/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L$(brew --prefix openssl@3)/lib \
          -L$(brew --prefix udunits)/lib $LDFLAGS"
          export CPPFLAGS="-I$(brew --prefix openssl@3)/include \
          -I$(brew --prefix udunits)/include $CPPFLAGS"


      - name: Install R package dependencies
        run: |
          Rscript -e 'if (!requireNamespace("remotes", quietly=TRUE)) install.packages("remotes")'
          Rscript -e 'remotes::install_deps(dependencies = TRUE, upgrade = "never")'

      - name: Build source tarball
        run: R CMD build . --no-manual

      - name: Install MOSAIC from tarball
        run: R CMD INSTALL MOSAIC_*.tar.gz

      - name: Smoke-load MOSAIC
        run: Rscript -e 'library(MOSAIC)'

      # Default PR / push runs the FAST tier SERIALLY. The slow prior-derivation
      # tests gate on MOSAIC_RUN_SLOW_TESTS (unset here); engine/keras/integration
      # tests stay gated on their own env vars. We force TESTTHAT_PARALLEL=FALSE
      # here so the inner-parallel tests (mclapply fork / PSOCK cluster) actually
      # run -- they self-skip under Config/testthat/parallel (local dev speedup)
      # to avoid nesting parallel-over-parallel, so CI must run serial to cover
      # them. ~2 min serial is acceptable; local `devtools::test()` stays parallel.
      - name: Run testthat (fast tier, serial -> full coverage)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          TESTTHAT_PARALLEL: 'FALSE'
        run: Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'

      # Nightly schedule / manual dispatch runs the SLOW tier in addition to the
      # fast tier (integration/keras tests stay gated on their own env vars).
      - name: Run testthat (slow tier, serial)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          MOSAIC_RUN_SLOW_TESTS: '1'
          TESTTHAT_PARALLEL: 'FALSE'
        run: Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'


      # The Python environment exists ONLY for the keras3 suitability model --
      # simulation and calibration are pure R and import nothing. Building it
      # means a Miniforge install plus a ~2-3 GB TensorFlow solve, which is far
      # too much to pay on every push to learn that environment.yml still
      # solves. It runs nightly instead, where that is exactly the question.
      - name: Set up Miniforge (Conda)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && runner.os != 'macOS'
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-version: "latest"

      - name: Install and check MOSAIC Python deps
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && runner.os != 'macOS'
        run: |
          Rscript -e 'MOSAIC::install_dependencies(force=TRUE)'
          Rscript -e 'MOSAIC::check_dependencies()'
