# MOSAIC calibration metric glossary (MOSAIC 1.5.1).
#
# Single source of every word, formula and target template shown by the
# calibration-diagnostics report (plot_model_calibration_report()), the report
# appendix, the docs (MOSAIC-docs/05-model-calibration.Rmd) and the dashboard.
# Read it with MOSAIC:::.mosaic_glossary(). The report reads nothing but this
# file and 3_results/calibration_diagnostics.json.
#
# Schema (version 1.5.1; every 1.4.0 field is unchanged, so a 1.4.0 reader
# still finds `version` and `metrics[]` with its seven fields):
#
#   version          glossary version; written to calibration_diagnostics.json
#                    as run.glossary_version
#   tokens           rich-text tokens. Any text field below, and every *_display
#                    string in calibration_diagnostics.json, may contain {name}
#                    for a token defined here. Render a token as `text` (Unicode),
#                    `ascii` (plain-text fallback; what the PDF uses outside
#                    formulas), `plotmath` (R plotmath, the PDF) or `katex`.
#   placeholders     {name} slots that are NOT tokens: they are filled from the
#                    diagnostics file before the text is shown (listed below).
#   report           the report's fixed wording: section titles, captions,
#                    column headings, dividers, status words, the legacy notice.
#   retired_metrics  metrics removed in 1.4.0, with the reason (shown in the
#                    report appendix).
#   metrics[]        one entry per metric:
#     key                identifier; matches the summary.json /
#                        calibration_diagnostics.json field where one exists
#     label              display name (appendix heading)
#     short_label        table name; rich text (tokens allowed)
#     what_it_tells_you  one line for the report's "What it tells you" column;
#                        rich text, placeholders allowed
#     formula_plotmath   the formula as R plotmath; each line is one expression
#                        (parsed with str2expression()); "" when the metric is a
#                        category or a figure and has no formula
#     formula_katex      the same formula for KaTeX ("" when none)
#     target_template    how its target is written, from placeholders and tokens,
#                        or null when it has none
#     target_note        optional small print under the target
#     units              what the value is measured in
#     definition         what the number is, in plain language
#     formula            how it is computed, in words
#     how_to_read        what high / low values mean
#     threshold          bands used by MOSAIC, always marked as a convention, or "none"
#     not_a_measure_of   what the number does not tell you
#
# Placeholders: in a status check, {op} / {op_yellow} are the operator tokens
# of status.checks[].operator / operator_yellow and {green} / {yellow} the
# threshold_green_display / threshold_yellow_display strings; {target} is an
# info row's target_value_display; {min} / {max} are run.min_ensemble_members /
# run.max_ensemble_members. The report strings name their own placeholders.
#
# Design: claude/reporting_audit/SPEC_CONVERGENCE.md (sections 2 and 5);
# output contract (versioned with the package):
# inst/extdata/calibration_diagnostics_schema.md.

version: "1.5.1"

tokens:
  ge: {text: "≥", ascii: ">=", plotmath: "phantom() >= phantom()", katex: "\\ge"}
  le: {text: "≤", ascii: "<=", plotmath: "phantom() <= phantom()", katex: "\\le"}
  lt: {text: "<", ascii: "<", plotmath: "phantom() < phantom()", katex: "<"}
  khat: {text: "k̂", ascii: "k-hat", plotmath: "widehat(k)", katex: "\\hat{k}"}
  alpha: {text: "α", ascii: "alpha", plotmath: "alpha", katex: "\\alpha"}
  eta: {text: "η", ascii: "eta", plotmath: "eta", katex: "\\eta"}
  f1: {text: "f₁", ascii: "f1", plotmath: "f[1]", katex: "f_1"}
  ESSall: {text: "ESS_all", ascii: "ESS_all", plotmath: "ESS[all]", katex: "\\mathrm{ESS}_{\\mathrm{all}}"}
  ESSE: {text: "ESS_E", ascii: "ESS_E", plotmath: "ESS[E]", katex: "\\mathrm{ESS}_E"}
  E: {text: "|E|", ascii: "|E|", plotmath: "'|' * E * '|'", katex: "|E|"}

